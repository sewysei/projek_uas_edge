---
# 3. AGEN KOORDINATOR & LOGGER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-coordinator
  template:
    metadata:
      labels:
        app: agent-coordinator
    spec:
      containers:
        - name: coordinator
          image: local/edge-agent:1.0
          imagePullPolicy: Never
          command: ["python", "-u", "coordinator_agent.py"]
          envFrom:
            - configMapRef:
                name: edge-agent-config
          env:
            - name: AGENT_ID
              value: "coordinator"
            - name: MQTT_USER
              value: "coorduser"
            - name: MQTT_PASS
              value: "coordpass123"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            exec:
              command:
                [
                  "python",
                  "-c",
                  "import os, time, sys; sys.exit(0 if time.time() - os.path.getmtime('/tmp/healthy') < 10 else 1)",
                ]
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                [
                  "python",
                  "-c",
                  "import os, time, sys; sys.exit(0 if time.time() - os.path.getmtime('/tmp/healthy') < 10 else 1)",
                ]
            initialDelaySeconds: 5
            periodSeconds: 5
